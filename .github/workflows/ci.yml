name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install -r infra/requirements.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Types (mypy)
        run: mypy core
      - name: Tests (unit + infra guardrails)
        run: pytest

  cdk-synth:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          pip install -r infra/requirements.txt
          npm install -g aws-cdk@2.1146.1
      - name: Synth dev (no AWS credentials needed)
        working-directory: infra
        run: cdk synth -c env=dev -c github_owner=${{ github.repository_owner }} -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
